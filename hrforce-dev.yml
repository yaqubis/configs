logging:
  level:
    org.springframework.security: DEBUG
spring:
  application:
    name: HR-Force
    security:
      jwt:
        secret-key: ${JWT_SECRET}
        expiration: 900000
  datasource:
    url: jdbc:postgresql://localhost:5432/int-health-db
    username: ${DB_USR}
    password: ${DB_PWD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

server:
  port: 8086
  servlet:
    context-path: /hrforce

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
